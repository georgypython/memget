services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memget-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-admin}
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: 

