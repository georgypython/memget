[project]
name = "memget"
version = "0.1.0"
description = "LLM & RAG Memory search tool"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "black>=26.1.0",
    "docling>=2.101.0",
    "docling-slim>=2.101.0",
    "fastapi[standard]>=0.127.0",
    "langchain>=1.3.4",
    "orjson>=3.11.5",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
